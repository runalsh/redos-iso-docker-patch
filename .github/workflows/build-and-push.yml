name: Build and Push RED OS Docker Images

on:
  push:
    branches: [ main, master ]
    paths:
      - 'releases.txt'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if tag exists in registry'
        required: false
        type: boolean
        default: false
      preset:
        description: 'Preset to build (minimal|server|workstation)'
        required: false
        default: 'minimal'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dnf rpm curl tar gzip

      - name: Login to Docker Hub
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        env:
          PUSH_TO_DOCKERHUB: ${{ secrets.DOCKER_PASSWORD != '' }}
          PUSH_TO_GHCR: true
          SKIP_EXISTS_CHECK: ${{ github.event.inputs.force_rebuild || false }}
        run: |
          PRESET="${{ github.event.inputs.preset || 'minimal' }}"
          ./build.sh --preset "$PRESET"
