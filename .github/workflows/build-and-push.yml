name: Build and Push RED OS Docker Images

on:
  push:
    branches: [ main, master ]
    paths:
      - 'releases.txt'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if tag exists in registry'
        required: false
        type: boolean
        default: false
      preset:
        description: 'Preset to build (minimal|server|workstation)'
        required: false
        default: 'minimal'

jobs:
  select-runner:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runner_type: ${{ steps.check.outputs.runner_type }}
    steps:
      - name: Check if phylex runner is online
        id: check
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GH_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          RESPONSE=$(gh api "repos/${{ github.repository }}/actions/runners" 2>/dev/null || true)
          STATUS=$(echo "$RESPONSE" | jq -r '.runners[]? | select(.name=="phylex") | .status' 2>/dev/null || echo "offline")
          if [ "$STATUS" = "online" ]; then
            echo "Runner phylex is ONLINE."
            HAS_LABEL=$(echo "$RESPONSE" | jq -r '.runners[] | select(.name=="phylex") | .labels[]? | select(.name=="phylex") | .name' 2>/dev/null || true)
            if [ "$HAS_LABEL" = "phylex" ]; then
              echo 'runner_type=["self-hosted", "phylex"]' >> "$GITHUB_OUTPUT"
            else
              echo 'runner_type=["self-hosted"]' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Runner phylex is not available ($STATUS). Falling back to ubuntu-latest."
            echo 'runner_type=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner_type) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          if command -v apt-get &>/dev/null; then
            sudo apt-get update -qq || true
            sudo apt-get install -y -qq dnf rpm p7zip-full libarchive-tools curl tar gzip || true
          elif command -v dnf &>/dev/null; then
            sudo dnf install -y -q dnf rpm p7zip curl tar gzip || true
          elif command -v yum &>/dev/null; then
            sudo yum install -y -q dnf rpm p7zip curl tar gzip || true
          fi

      - name: Login to Docker Hub
        if: env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Images
        env:
          PUSH_TO_DOCKERHUB: ${{ secrets.DOCKER_PASSWORD != '' }}
          PUSH_TO_GHCR: true
          SKIP_EXISTS_CHECK: ${{ github.event.inputs.force_rebuild || false }}
        run: |
          PRESET="${{ github.event.inputs.preset || 'minimal' }}"
          ./build.sh --preset "$PRESET"

      - name: Always Clean Up Leftover Mounts and Files
        if: always()
        run: |
          sudo umount /tmp/iso_mnt_* 2>/dev/null || true
          sudo rm -rf /tmp/iso_mnt_* /tmp/redos_rootfs_* /tmp/download_*.iso 2>/dev/null || true
